services:
  - type: web
    runtime: node
    name: nova-web-guide-demo
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_CHAT_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_TTS_ENABLED
        value: "true"
      - key: GEMINI_TTS_MODEL
        value: gemini-3.8-flash-lite-tts
      - key: GEMINI_TTS_VOICE
        value: Orus
      - key: PAID_VOICE_ENABLED
        value: "false"
      - key: EMBED_AI_ENABLED
        value: "true"
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: EMBED_ELEVENLABS_VOICE_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_TO_EMAIL
        sync: false
      - key: CONTACT_PUBLIC_EMAIL
        sync: false
      - key: CONTACT_FROM_EMAIL
        sync: false
      - key: ONLINE_REQUEST_LIMIT
        value: "30"
